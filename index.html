<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>论文速览 PaperBrief</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>论文速览 <span class="en">PaperBrief</span></h1>
      <p class="sub">把一段论文摘要粘进来，帮你划重点。</p>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <label for="input">摘要原文</label>
      <textarea id="input" placeholder="把 Abstract / 中文摘要粘贴到这里，然后点下面的按钮……"></textarea>

      <div class="toolbar">
        <div class="left">
          <button id="sampleBtn" class="link">载入示例</button>
          <select id="lang" title="语言选择（还没接逻辑）">
            <option value="auto">自动判断</option>
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </div>
        <button id="run" class="primary">生成要点</button>
      </div>

      <p class="hint">目前只支持纯文本，PDF 上传和网页链接都还没做。</p>
    </section>

    <section id="result" class="card hidden">
      <div class="result-head">
        <h2>要点</h2>
        <button id="exportBtn" class="link">导出 Markdown</button>
      </div>
      <ol id="summary"></ol>

      <h2>关键词</h2>
      <div id="keywords" class="tags"></div>

      <p id="stats" class="stats"></p>
    </section>
  </main>

  <footer class="wrap foot">
    <span>PaperBrief v0.1 · 2026 软工实践周</span>
    <a href="#" id="historyLink">历史记录</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
